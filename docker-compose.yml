services:
  mysql:
    image: mysql:8.4
    container_name: foodbridge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foodbridge
      MYSQL_USER: foodbridge
      MYSQL_PASSWORD: foodbridge123
      MYSQL_ROOT_PASSWORD: localroot123
    ports:
      - "3307:3306"
    volumes:
      - foodbridge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:mysql://mysql:3306/foodbridge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: foodbridge
      DB_PASSWORD: foodbridge123
      JWT_SECRET: foodbridge-local-development-secret-change-this-before-deployment-2026
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /app/uploads
      ADMIN_EMAIL: admin@foodbridge.local
      ADMIN_PASSWORD: Admin123!
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata
    ports:
      - "8080:8080"
    volumes:
      - foodbridge_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodbridge-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  foodbridge_mysql_data:
  foodbridge_uploads:
