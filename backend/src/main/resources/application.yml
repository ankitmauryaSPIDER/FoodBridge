server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  application:
    name: foodbridge-api
  flyway:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodbridge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:foodbridge}
    password: ${DB_PASSWORD:foodbridge123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:foodbridge-local-development-secret-change-this-before-deployment-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
